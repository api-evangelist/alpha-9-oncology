name: Alpha-9 Oncology
description: Alpha-9 Oncology is a clinical-stage radiopharmaceutical company that spun out of the University
  of British Columbia and BC Cancer in 2019 to develop a portfolio of targeted cancer therapies. Alpha-9
  engineers bespoke radiopharmaceutical molecules — optimizing the binder, linker, chelator, and radioisotope
  — to deliver radiation directly to tumor cells while limiting exposure to healthy tissue. The company
  operates purpose-built research facilities in Vancouver, BC and Boston, MA, and in October 2024 raised
  an oversubscribed $175M Series C led by Lightspeed Venture Partners and Ascenta Capital to advance its
  clinical pipeline. Alpha-9 is a drug developer and does not currently publish a public developer API;
  this profile captures its company identity and public-web surface for the API Evangelist network.
